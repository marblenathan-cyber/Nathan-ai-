<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nathan Ultra</title>
    <style>
        :root { --accent: #8ab4f8; --bg: #131314; --panel: #1e1f20; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            margin: 0; 
            background: var(--bg); 
            color: #e3e3e3; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100svh; /* Fix for iOS 26 dynamic bars */
            display: flex; 
            flex-direction: column;
            overflow: hidden;
        }

        #header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            background: var(--bg);
            z-index: 10;
        }

        #header h1 { margin: 0; font-size: 18px; font-weight: 500; color: var(--accent); }
        
        #status-pill {
            font-size: 10px;
            padding: 4px 10px;
            border-radius: 20px;
            background: #333;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #chat-flow {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 40px;
        }

        .bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 15px;
            word-wrap: break-word;
        }

        .ai { background: var(--panel); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #333; }
        .user { background: var(--accent); color: #000; align-self: flex-end; border-bottom-right-radius: 4px; font-weight: 500; }

        /* THE FIX: Safe Area Padding for Supervised iPads */
        #input-container {
            background: var(--panel);
            padding: 12px 15px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input {
            flex: 1;
            background: #2e2f30;
            border: none;
            color: white;
            padding: 14px 20px;
            border-radius: 30px;
            font-size: 16px; /* Prevents auto-zoom on click */
            outline: none;
        }

        button {
            background: var(--accent);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }

        button:disabled { opacity: 0.3; filter: grayscale(1); }

        #progress-track {
            position: absolute;
            top: 0; left: 0;
            height: 2px;
            background: var(--accent);
            width: 0%;
            transition: 0.3s;
            box-shadow: 0 0 10px var(--accent);
        }
    </style>
</head>
<body>

<div id="progress-track"></div>

<div id="header">
    <h1>Nathan Ultra</h1>
    <div id="status-pill">Waking Up...</div>
</div>

<div id="chat-flow">
    <div class="bubble ai">I'm initializing my core bypass. If this is your first time, I'm downloading about 90MB of brain data. Stay on this screen.</div>
</div>

<div id="input-container">
    <input type="text" id="user-in" placeholder="Connecting..." disabled>
    <button id="send-btn" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="black"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
</div>

<script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

    // BYPASS SETTINGS:
    env.allowRemoteModels = true;
    env.useBrowserCache = true; // Essential for working offline/after block
    env.backends.onnx.wasm.numThreads = 1; // More stable on Supervised iPads

    const flow = document.getElementById('chat-flow');
    const input = document.getElementById('user-in');
    const btn = document.getElementById('send-btn');
    const bar = document.getElementById('progress-track');
    const pill = document.getElementById('status-pill');

    let bot;

    async function setup() {
        try {
            // Using SmolLM2-135M: The fastest high-logic model in 2026
            bot = await pipeline('text-generation', 'Xenova/SmolLM2-135M-Chat', {
                progress_callback: (p) => {
                    if (p.status === 'progress') {
                        bar.style.width = p.progress + "%";
                        pill.innerText = `Sync: ${Math.round(p.progress)}%`;
                    }
                }
            });

            pill.innerText = "Online";
            pill.style.background = "#1e4620";
            pill.style.color = "#4ade80";
            input.disabled = false;
            btn.disabled = false;
            input.placeholder = "Message Nathan...";
            
            addMsg("ai", "Core connection 100% successful. How can I help you today?");

        } catch (e) {
            pill.innerText = "Error";
            addMsg("ai", "<b>Connection Blocked.</b> Your school filter stopped the download. <br><br><b>The Solution:</b> Tap the Share button -> 'Add to Home Screen'. Open it from your home screen and it should bypass the block.");
        }
    }

    async function send() {
        const text = input.value;
        if (!text || btn.disabled) return;

        addMsg("user", text);
        input.value = "";
        btn.disabled = true;
        pill.innerText = "Thinking...";

        const output = await bot(text, { 
            max_new_tokens: 120, 
            temperature: 0.6,
            repetition_penalty: 1.2 
        });

        const reply = output[0].generated_text.split(text)[1] || output[0].generated_text;
        addMsg("ai", reply.trim());
        
        btn.disabled = false;
        pill.innerText = "Online";
    }

    function addMsg(type, msg) {
        const d = document.createElement('div');
        d.className = `bubble ${type}`;
        d.innerHTML = msg;
        flow.appendChild(d);
        flow.scrollTop = flow.scrollHeight;
    }

    btn.onclick = send;
    input.onkeypress = (e) => e.key === 'Enter' && send();

    setup();
</script>

</body>
</html>
