<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nathan AI</title>
    <style>
        :root { --blue: #4285f4; --dark: #131314; }
        body { 
            margin: 0; background: var(--dark); color: white; 
            font-family: -apple-system, system-ui; 
            height: 100dvh; display: flex; flex-direction: column;
            overflow: hidden;
        }
        #header { padding: 15px; border-bottom: 1px solid #333; font-weight: 600; color: var(--blue); }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .m { max-width: 85%; padding: 12px; border-radius: 20px; font-size: 15px; line-height: 1.4; }
        .ai { background: #1e1f20; align-self: flex-start; border-left: 3px solid var(--blue); }
        .user { background: #2e2f30; align-self: flex-end; }
        
        /* FIX: This keeps the bar visible even if Safari's menu is open */
        #input-area { 
            padding: 15px; background: #131314; border-top: 1px solid #333;
            display: flex; gap: 10px;
            padding-bottom: calc(15px + env(safe-area-inset-bottom));
        }
        input { 
            flex: 1; background: #2e2f30; border: none; color: white; 
            padding: 12px 18px; border-radius: 25px; outline: none; font-size: 16px;
        }
        #bar { height: 2px; background: var(--blue); width: 0%; transition: 0.3s; }
    </style>
</head>
<body>

<div id="header">Nathan v7 (Direct Link)</div>
<div id="bar"></div>
<div id="chat"><div class="m ai">Establishing connection to Core... if the blue bar stays at 0%, the school filter is blocking the brain download.</div></div>

<div id="input-area">
    <input type="text" id="in" placeholder="Connecting..." disabled>
</div>

<script type="module">
    // We use a different "Tunnel" for the library to sneak past the filter
    import { pipeline, env } from 'https://esm.sh/@xenova/transformers@2.17.1';

    env.allowRemoteModels = true;
    env.remoteHost = "https://huggingface.co";
    env.remotePathTemplate = "{model}/resolve/{revision}/";

    const chat = document.getElementById('chat');
    const input = document.getElementById('in');
    const bar = document.getElementById('bar');

    async function start() {
        try {
            // Using the tiny 'SmolLM' model - easiest to bypass filters
            const bot = await pipeline('text-generation', 'Xenova/SmolLM-135M-Chat', {
                progress_callback: (p) => {
                    if (p.status === 'progress') bar.style.width = p.progress + "%";
                }
            });

            input.disabled = false;
            input.placeholder = "Message Nathan...";
            addMsg("ai", "Core Online. The filter has been bypassed.");

            input.onkeypress = async (e) => {
                if (e.key === 'Enter' && input.value) {
                    const val = input.value;
                    input.value = "";
                    addMsg("user", val);
                    
                    const res = await bot(val, { max_new_tokens: 60, temperature: 0.7 });
                    const reply = res[0].generated_text.split(val)[1] || res[0].generated_text;
                    addMsg("ai", reply.trim());
                }
            };
        } catch (e) {
            addMsg("ai", "<b>BLOCK DETECTED.</b> The school firewall is stopping the 'Brain' download. Try refreshing or using a personal hotspot for the first load.");
        }
    }

    function addMsg(t, s) {
        const d = document.createElement('div');
        d.className = `m ${t}`;
        d.innerHTML = s;
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
    }

    start();
</script>
</body>
</html>
