<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Nathan AI</title>
    <style>
        :root { --gemini-blue: #4285f4; --gemini-purple: #9b72cb; --gemini-red: #d96570; --bg: #131314; }
        body { margin: 0; background: var(--bg); color: #e3e3e3; font-family: 'Google Sans', Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* The Gemini Glow Header */
        #header { padding: 20px; font-size: 20px; font-weight: 500; background: linear-gradient(90deg, #4285f4, #9b72cb, #d96570); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 10px; }
        
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 24px; scroll-behavior: smooth; }
        .message { max-width: 85%; line-height: 1.6; font-size: 16px; animation: fadeIn 0.3s ease; }
        .user-msg { align-self: flex-end; background: #2e2f30; padding: 12px 20px; border-radius: 20px; color: #fff; }
        .ai-msg { align-self: flex-start; display: flex; gap: 15px; }
        .ai-icon { width: 30px; height: 30px; background: linear-gradient(45deg, #4285f4, #9b72cb); border-radius: 50%; flex-shrink: 0; }
        
        /* Gemini Loading Animation */
        #loader { display: none; margin-left: 45px; width: 100px; height: 4px; background: #2e2f30; border-radius: 2px; overflow: hidden; position: relative; }
        #loader::after { content: ""; position: absolute; width: 40%; height: 100%; background: linear-gradient(90deg, #4285f4, #9b72cb); animation: slide 1.5s infinite linear; }
        @keyframes slide { from { left: -40%; } to { left: 100%; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Input Area */
        #input-area { padding: 20px; background: #131314; display: flex; justify-content: center; }
        .input-wrapper { width: 90%; max-width: 700px; background: #1e1f20; border-radius: 30px; display: flex; align-items: center; padding: 5px 20px; border: 1px solid transparent; transition: 0.3s; }
        
    </style>
</head>
<body>

<div id="header">Nathan <span style="font-size: 12px; color: #8e918f; -webkit-text-fill-color: #8e918f;">v6.0 Gemini Edition</span></div>

<div id="chat-container">
    <div class="ai-msg">
        <div class="ai-icon"></div>
        <div class="message">Hello! I'm Nathan. How can I help you be more creative or productive today?</div>
    </div>
</div>

<div id="loader"></div>

<div id="input-area">
    <div class="input-wrapper">
        <input type="text" id="user-input" placeholder="Type a message..." disabled>
        <button id="send-btn" disabled>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#4285f4"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>
</div>

<script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

    const container = document.getElementById('chat-container');
    const input = document.getElementById('user-input');
    const btn = document.getElementById('send-btn');
    const loader = document.getElementById('loader');

    let chat;

    async function init() {
        try {
            // Loading Qwen-1.5B (The 'Nano' engine that mimics Gemini's logical flow)
            chat = await pipeline('text-generation', 'Xenova/Qwen1.5-0.5B-Chat');
            
            input.disabled = false;
            btn.disabled = false;
            btn.classList.add('active');
            input.placeholder = "Message Nathan...";
        } catch (e) {
            addMessage("ai", "I had trouble connecting to my core. Please refresh or check your internet.");
        }
    }

    async function handleSend() {
        const text = input.value;
        if (!text) return;

        addMessage("user", text);
        input.value = "";
        loader.style.display = "block";

        const output = await chat(text, { 
            max_new_tokens: 150, 
            temperature: 0.7,
            repetition_penalty: 1.1
        });

        const reply = output[0].generated_text.split(text)[1] || output[0].generated_text;
        
        loader.style.display = "none";
        addMessage("ai", reply.trim());
    }

    function addMessage(type, text) {
        const div = document.createElement('div');
        div.className = type === "user" ? "message user-msg" : "ai-msg";
        
        if (type === "ai") {
            div.innerHTML = `<div class="ai-icon"></div><div class="message">${text}</div>`;
        } else {
            div.innerText = text;
        }
        
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    btn.onclick = handleSend;
    input.onkeypress = (e) => e.key === 'Enter' && handleSend();

    init();
</script>

</body>
</html>
